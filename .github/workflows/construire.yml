# Construire l'image du travailleur, chez GitHub et non chez le loueur.
#
# POURQUOI ICI. Le constructeur de RunPod coupe toute construction à trente
# minutes, et notre message d'erreur figure mot pour mot dans sa page de
# limitations — la seule issue qu'il propose est de construire ailleurs et de
# pousser sur un registre. C'est ce que RunPod fait lui-même pour ses propres
# images à modèles inclus, qui vont jusqu'à 37,67 Go.
#
# CE QUI COINCE ICI, ET C'EST LE SEUL RISQUE : l'espace disque. Une machine de
# construction gratuite arrive avec une trentaine de gigaoctets libres, et notre
# image en fait une soixantaine — quinze pour la base, quarante-quatre de poids.
# Les deux premières étapes font donc le ménage et déplacent le stockage de Docker
# sur le disque de travail, qui est le grand. L'espace est affiché avant et après :
# si ça échoue quand même, c'est là qu'on le verra.
#
# Se lance à la main, depuis l'onglet Actions du dépôt.

name: Construire l'image du travailleur

on:
  workflow_dispatch:

jobs:
  construire:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Espace disque au départ
        run: df -h /

      # Ce que la machine de construction embarque et dont on n'a aucun usage.
      # Commandes explicites plutôt qu'une action tierce : on lit ce qu'on exécute
      # (règle de sécurité du projet, 22/08).
      - name: Faire de la place
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      # Le disque monté sur /mnt est bien plus grand que la racine. Docker y écrit
      # ses couches, qui sont l'essentiel du volume.
      - name: Déplacer le stockage de Docker sur le grand disque
        run: |
          sudo mkdir -p /mnt/docker
          sudo systemctl stop docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: S'annoncer au registre de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `push: true` envoie les couches au registre au fur et à mesure, au lieu de
      # garder l'image entière sur le disque avant de la pousser.
      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ghcr.io/oricot/runpodsreverlessh3:latest

      - name: Espace disque à l'arrivée
        if: always()
        run: df -h / /mnt
